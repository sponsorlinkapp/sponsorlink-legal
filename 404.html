<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SponsorLink</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    padding: 32px 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #201F29;
    background: #EFEBFB;
    background-image:
      radial-gradient(ellipse 900px 700px at 10% -10%, #D9CBFA 0%, transparent 60%),
      radial-gradient(ellipse 800px 700px at 100% 10%, #C9F2D9 0%, transparent 55%),
      radial-gradient(ellipse 900px 800px at 50% 120%, #9B87C4 0%, transparent 60%),
      linear-gradient(180deg, #F6F3FD 0%, #EAF3EC 100%);
  }
  .orb {
    position: fixed; border-radius: 50%; filter: blur(50px); z-index: 0; pointer-events: none;
  }
  .orb-1 { width: 260px; height: 260px; background: radial-gradient(circle, #B9A6DE, transparent 70%); top: -60px; right: -60px; opacity: 0.8; }
  .orb-2 { width: 220px; height: 220px; background: radial-gradient(circle, #6FCF97, transparent 70%); bottom: -40px; left: -60px; opacity: 0.6; }

  .wrap { position: relative; z-index: 1; max-width: 400px; width: 100%; text-align: center; }

  .logo-ring {
    width: 168px; height: 168px; margin: 0 auto 28px; border-radius: 40px;
    background: linear-gradient(145deg, #ffffff, #f1edfa);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 1px rgba(255,255,255,0.8) inset, 0 20px 40px -10px rgba(80,60,140,0.35);
  }
  .logo-ring img { width: 138px; height: 138px; border-radius: 32px; display: block; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: #6B5C99; background: rgba(255,255,255,0.6); border: 1px solid rgba(124,95,191,0.18);
    padding: 5px 12px; border-radius: 999px; margin-bottom: 22px;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: #0E8A4B; }

  .card {
    background: rgba(255,255,255,0.72);
    -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
    border-radius: 26px; padding: 36px 26px 30px;
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 30px 60px -20px rgba(64,45,110,0.25), 0 1px 0 rgba(255,255,255,0.6) inset;
  }
  .card h1 {
    font-size: 1.5rem; margin: 0 0 10px; line-height: 1.3; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #6E4FC1, #14895A);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card p { color: #57536A; margin: 0 0 28px; font-size: 0.96rem; line-height: 1.55; }

  .stores { display: flex; flex-direction: column; gap: 12px; }
  .badge {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    padding: 14px 20px; border-radius: 16px;
    text-decoration: none; font-weight: 700; font-size: 0.98rem;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .badge:active { transform: scale(0.98); }
  .badge.apple {
    background: linear-gradient(180deg, #2b2b33, #17171c); color: #fff;
    box-shadow: 0 14px 26px -10px rgba(20,20,25,0.55);
  }
  .badge.google {
    background: #ffffff; color: #201F29; border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 14px 26px -14px rgba(20,20,25,0.25);
  }
  .badge:hover { transform: translateY(-2px); }
  .badge svg { width: 21px; height: 21px; flex-shrink: 0; }

  .foot { margin-top: 28px; font-size: 0.82rem; color: #8A85A3; }
  .foot a { color: #6E4FC1; text-decoration: none; font-weight: 600; }

  .block-ar { display: none; }
  body.ar .block-en { display: none; }
  body.ar .block-ar { display: block; }
  .foot-ar { display: none; }
  body.ar .foot-en { display: none; }
  body.ar .foot-ar { display: inline; }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="wrap">
    <div class="logo-ring"><img src="https://sponsorlink.app/logo.png" alt="SponsorLink"></div>
    <div class="eyebrow block-en"><span class="dot"></span>Job link</div>
    <div class="eyebrow block-ar" dir="rtl"><span class="dot"></span>رابط وظيفة</div>

    <div class="card block-en">
      <h1 id="title-en">Continue in the app</h1>
      <p id="desc-en">Get SponsorLink to view this job and apply in a couple of taps.</p>
      <div class="stores">
        <a class="badge apple" href="https://apps.apple.com/app/id6811664123">
          <svg viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
          App Store
        </a>
        <a class="badge google" href="https://play.google.com/store/apps/details?id=app.sponsorlink.mobile">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924z"/><path fill="#EA4335" d="M13.544 10.023 2.504.016a1.466 1.466 0 0 0-.946-.179l11.04 10.973z"/><path fill="#FBBC04" d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594z"/><path fill="#34A853" d="M13.544 12.09l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
          Google Play
        </a>
      </div>
    </div>

    <div class="card block-ar" dir="rtl">
      <h1 id="title-ar">تابع من داخل التطبيق</h1>
      <p id="desc-ar">حمّل SponsorLink لعرض الوظيفة والتقديم عليها بضغطتين بس.</p>
      <div class="stores">
        <a class="badge apple" href="https://apps.apple.com/app/id6811664123">
          <svg viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
          App Store
        </a>
        <a class="badge google" href="https://play.google.com/store/apps/details?id=app.sponsorlink.mobile">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924z"/><path fill="#EA4335" d="M13.544 10.023 2.504.016a1.466 1.466 0 0 0-.946-.179l11.04 10.973z"/><path fill="#FBBC04" d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594z"/><path fill="#34A853" d="M13.544 12.09l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
          Google Play
        </a>
      </div>
    </div>

    <div class="foot">SponsorLink — <span class="foot-en">Saudi Arabia</span><span class="foot-ar">المملكة العربية السعودية</span></div>
  </div>

<script>
// GitHub Pages serves this for any unmatched path — for /job/<id> links
// shared from the app, this is the fallback for someone WITHOUT the app
// installed (with the app installed, Universal Links/App Links open it
// directly and this page never loads). Auto-set language from the browser,
// and if the path does look like a job link, try the custom-scheme deep
// link once in case the OS didn't intercept it as a Universal/App Link
// (older Android, or verification not yet propagated) — harmless no-op if
// the app isn't installed, no visible error either way.
(function () {
  if ((navigator.language || '').toLowerCase().startsWith('ar')) {
    document.body.className = 'ar';
  }
  var parts = location.pathname.split('/').filter(Boolean);
  if (parts[0] === 'job' && parts[1]) {
    window.location.replace('sponsorlink://job/' + parts[1]);
  } else {
    document.querySelector('.eyebrow.block-en').style.display = 'none';
    document.querySelector('.eyebrow.block-ar').style.display = 'none';
    document.getElementById('title-en').textContent = 'Page not found';
    document.getElementById('desc-en').textContent = "This page doesn't exist, but you can still get the app below.";
    document.getElementById('title-ar').textContent = 'الصفحة غير موجودة';
    document.getElementById('desc-ar').textContent = 'هذه الصفحة غير موجودة، بس تقدر تحمّل التطبيق من الأسفل.';
  }
})();
</script>
</body>
</html>
